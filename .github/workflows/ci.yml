name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main, 'feature/**']
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE: docker.io/thanhtuanle/judge-portal

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    name: Test & Lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Plain eslint: the npm "lint" script runs with --fix, which must not rewrite files in CI.
        run: npx eslint .

      - name: Type check
        run: npm run type-check

      - name: Unit tests
        run: npx vitest run

      - name: Build to verify
        run: npm run build-only

      - name: Initial JS budget of /problems
        # At most 409 600 bytes gzip; reads the manifest of the build above and exits 1 over budget.
        run: npm run size:check

  image:
    needs: test-and-lint
    runs-on: ubuntu-latest
    name: Image
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build image
        run: >-
          docker build
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:main" .

      - name: Runs as uid 101
        run: test "$(docker run --rm --entrypoint id "$IMAGE:${{ github.sha }}" -u)" = 101

      - name: Serves no build manifest
        run: docker run --rm --entrypoint test "$IMAGE:${{ github.sha }}" ! -e /usr/share/nginx/html/.vite

      - name: Trivy (CRITICAL with a fix fails the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The image above (amd64) is the one tested and scanned. What is pushed is built again for amd64 and arm64, so the same tag runs on the
      # server and on an Apple-silicon laptop; the Dockerfile builds the platform-independent part natively, so arm64 is not emulated for it.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Push the multi-arch image
        run: >-
          docker buildx build --platform linux/amd64,linux/arm64
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --push -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:main" .
