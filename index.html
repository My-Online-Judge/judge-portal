<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <link rel="icon" href="/favicon.ico">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="An online judge for competitive programming. Submit your code, run it against test cases and get verdicts in real time.">
  <title>My OJ, online judge</title>
</head>

<body>
  <script>
    (function () {
      try {
        var m = localStorage.getItem('theme');
        var d = m === 'dark' || ((m !== 'light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', d);
        document.documentElement.dataset.theme = d ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
